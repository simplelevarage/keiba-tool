<script>

// =========================
// 統計ベース
// =========================

const stats = {
    winRate: [0,32.8,19.0,13.5,9.2,7.5,5.8,4.5,3.5,2.6,2.0,1.5,1.2,0.8,0.6,0.4,0.3,0.2,0.1],
    avgWinOdds: [0,2.4,4.4,6.4,9.2,12.5,17.5,24.5,34.0,46.0,62.0,85.0,110.0,150.0,200.0,260.0,340.0,430.0,550.0],
    avgPlOdds: [0,1.1,1.2,1.3,1.5,1.8,2.2,2.8,3.6,4.8,6.5,9.0,12.0,16.0,22.0,30.0,40.0,55.0,75.0]
};

// =========================
// レースレベル
// =========================

const classPower = {
    "平場":1,
    "OP":2,
    "G23":3,
    "G1":4
};

// =========================
// 判定開始
// =========================

document.getElementById('calc_v17').addEventListener('click', function() {

    let EV = 100;
    let BONUS = 1.0;
    let reasons = [];
    let coreHit = 0;
    let judgeComment = "";

    // =========================
    // 値取得
    // =========================

    const curClass = document.getElementById('v_cur_class').value;
    const surface = document.getElementById('v_surface').value;
    const dist = document.getElementById('v_dist').value;
    const curCond = document.getElementById('v_cur_cond').value;
    const waku = Number(document.getElementById('v_waku').value);

    const wRank = Math.min(18, Math.max(1,
        Number(document.getElementById('v_win_rank').value)
    ));

    const wOdds = Number(document.getElementById('v_win_odds').value);
    const pOdds = Number(document.getElementById('v_pl_odds').value);

    const jID = document.getElementById('v_jockey').value;
    const style = document.getElementById('v_style').value;

    const prevClass = document.getElementById('v_prev_class').value;
    const prevCond = document.getElementById('v_prev_cond').value;

    const prevRank = Number(document.getElementById('v_prev_rank').value);
    const prO = Number(document.getElementById('v_prev_order').value);
    const prD = Number(document.getElementById('v_prev_diff_range').value);

    const g1 = Number(document.getElementById('v_g1_count').value);
    const p3 = Number(document.getElementById('v_p3_sum').value);

    // =========================
    // 入力確認
    // =========================

    if(
        !curClass ||
        !prevClass ||
        !wRank ||
        !wOdds ||
        !prevRank ||
        !style ||
        !jID
    ){
        alert("主要項目を入力してください");
        return;
    }

    // =========================
    // 圧勝判定
    // =========================

    let crushWin = false;

    // =========================
    // 人気乖離
    // =========================

    if(prevRank <= 3 && wRank >= 4){

        EV += 55;
        coreHit++;

        reasons.push(
            "<span class='bonus'>【市場乖離】前走人気→今回人気落ち</span>"
        );
    }

    // =========================
    // 前走人気評価
    // =========================

    if(prevRank === 1){

        EV += 35;

        reasons.push(
            "<span class='bonus'>前走1人気：能力評価高</span>"
        );
    }

    else if(prevRank === 2){

        EV += 25;

        reasons.push(
            "<span class='bonus'>前走2人気：能力評価</span>"
        );
    }

    else if(prevRank === 3){

        EV += 18;

        reasons.push(
            "<span class='bonus'>前走3人気：能力評価</span>"
        );
    }

    // =========================
    // 道悪無視
    // =========================

    let ignorePrev = false;

    if(prevCond === "重" || prevCond === "不良"){

        ignorePrev = true;

        reasons.push(
            "<span class='bonus'>前走道悪：内容無視</span>"
        );
    }

    // =========================
    // 前走着順
    // =========================

    if(!ignorePrev){

        if(prO === 7){

            EV += 85;
            coreHit++;

            reasons.push(
                "<span class='bonus'>【7着理論】期待値ゾーン</span>"
            );
        }

        else if(prO === 6 || prO === 8){

            EV += 55;
        }

        else if(prO >= 4 && prO <= 9){

            EV += 38;
        }

        else if(prO >= 10){

            if(style === "逃げ"){

                EV += 18;

                reasons.push(
                    "<span class='bonus'>逃げ大敗：巻き返し余地</span>"
                );

                if(wRank >= 10){

                    EV -= 18;

                    reasons.push(
                        "<span class='penalty'>人気薄逃げ：過剰期待注意</span>"
                    );
                }

            }else{

                EV -= 28;

                reasons.push(
                    "<span class='penalty'>前走大敗</span>"
                );
            }
        }
    }

    // =========================
    // 着差
    // =========================

    if(!ignorePrev){

        if(prO !== 1){

            if(prD <= 0.2){

                EV += 75;
                coreHit++;

                reasons.push(
                    "<span class='bonus'>前走僅差：内容優秀</span>"
                );
            }

            else if(prD >= 1.0){

                if(style === "逃げ"){

                    EV += 25;

                    reasons.push(
                        "<span class='bonus'>逃げ1秒負け：展開不利</span>"
                    );

                }else{

                    EV -= 45;

                    reasons.push(
                        "<span class='penalty'>1秒以上負け</span>"
                    );
                }
            }

        }else{

            if(prD >= 0.3){

                crushWin = true;

                EV += 40;
                coreHit++;

                reasons.push(
                    "<span class='bonus'>前走圧勝</span>"
                );
            }
        }
    }

    // =========================
    // クラス変動
    // =========================

    let classGap =
        classPower[prevClass] -
        classPower[curClass];

    if(classGap >= 1){

        EV += 35;

        reasons.push(
            "<span class='bonus'>格下げローテ</span>"
        );

        if(prevClass === "G1"){

            EV += 15;

            reasons.push(
                "<span class='bonus'>G1帰り</span>"
            );
        }
    }

    if(classGap <= -1){

        if(crushWin){

            EV -= 5;

            reasons.push(
                "<span class='bonus'>圧勝昇級</span>"
            );

        }else{

            EV -= 22;

            reasons.push(
                "<span class='penalty'>格上げローテ</span>"
            );
        }
    }

    // =========================
    // 単勝妙味
    // =========================

    let avgWin = stats.avgWinOdds[wRank];
    let winDiff = wOdds - avgWin;

    if(winDiff >= avgWin * 0.25){

        BONUS *= 1.10;
        coreHit++;

        reasons.push(
            "<span class='bonus'>単勝妙味</span>"
        );
    }

    else if(winDiff <= -(avgWin * 0.25)){

        BONUS *= 0.93;

        reasons.push(
            "<span class='penalty'>単勝過剰人気</span>"
        );
    }

    // =========================
    // 複勝妙味
    // =========================

    let avgPl = stats.avgPlOdds[wRank];
    let plDiff = pOdds - avgPl;

    if(plDiff >= avgPl * 0.25){

        BONUS *= 1.06;

        reasons.push(
            "<span class='bonus'>複勝妙味</span>"
        );
    }

    else if(plDiff <= -(avgPl * 0.25)){

        BONUS *= 0.96;

        reasons.push(
            "<span class='penalty'>複勝支持強め</span>"
        );
    }

    // =========================
    // 人気帯
    // =========================

    if(wRank >= 4 && wRank <= 9){

        BONUS *= 1.08;
        coreHit++;

        reasons.push(
            "<span class='bonus'>黄金期待値ゾーン</span>"
        );
    }

    else if(wRank <= 3){

        BONUS *= 0.90;

        reasons.push(
            "<span class='penalty'>上位人気</span>"
        );
    }

    else if(wRank >= 10){

        if(curClass !== "G1"){

            BONUS *= 0.90;

            reasons.push(
                "<span class='penalty'>人気薄</span>"
            );
        }
    }

    // =========================
    // 人気密集
    // =========================

    if(
        wRank >= 4 &&
        wRank <= 6 &&
        wOdds < stats.avgWinOdds[wRank] * 0.8
    ){

        BONUS *= 0.92;

        reasons.push(
            "<span class='penalty'>人気密集</span>"
        );
    }

    // =========================
    // 騎手補正
    // =========================

    if(jID === 'moreira'){

        BONUS *= 1.12;
    }

    else if(jID === 'lane' || jID === 'short_other'){

        BONUS *= 1.08;
    }

    else if(jID === 'lemaire'){

        BONUS *= 1.07;

        if(style === "先行" || style === "差し"){

            BONUS *= 1.04;
        }
    }

    else if(jID === 'kawada'){

        BONUS *= 1.07;

        if(style === "先行"){

            BONUS *= 1.05;
        }
    }

    else if(jID === 'iwata_y'){

        BONUS *= 1.05;

        if(waku <= 2){

            BONUS *= 1.10;

            reasons.push(
                "<span class='bonus'>岩田康×内枠</span>"
            );
        }
    }

    else if(jID === 'take'){

        BONUS *= 1.05;

        if(style === "逃げ"){

            BONUS *= 1.08;

            reasons.push(
                "<span class='bonus'>武豊×逃げ</span>"
            );
        }

        if(dist === "long"){

            BONUS *= 1.05;

            reasons.push(
                "<span class='bonus'>武豊×長距離</span>"
            );
        }
    }

    else if(jID === 'sakai'){

        BONUS *= 1.05;

        if(style === "逃げ" || style === "先行"){

            BONUS *= 1.05;
        }

        if(surface === "ダート" && curClass === "G1"){

            BONUS *= 1.08;
        }

        if(surface === "芝" && curClass === "G1"){

            BONUS *= 0.94;
        }
    }

    else if(jID === 'sugawara'){

        BONUS *= 1.04;

        if(style === "差し" || style === "追込"){

            BONUS *= 1.05;
        }

        if(curCond === "重" || curCond === "不良"){

            BONUS *= 1.05;
        }
    }

    else if(jID === 'tosaki'){

        BONUS *= 1.04;

        if(style === "先行"){

            BONUS *= 1.04;
        }
    }

    else if(jID === 'tannai'){

        BONUS *= 1.04;

        if(dist === "long"){

            BONUS *= 1.05;
        }
    }

    // =========================
    // G1経験
    // =========================

    if(g1 >= 1){

        BONUS *= (1 + (g1 * 0.025));

        reasons.push(
            "<span class='bonus'>G1経験</span>"
        );
    }

    // =========================
    // 近走人気
    // =========================

    if(p3 <= 10){

        BONUS *= 1.04;

        reasons.push(
            "<span class='bonus'>近走人気安定</span>"
        );
    }

    // =========================
    // CORE重複
    // =========================

    if(coreHit >= 4){

        BONUS *= 1.06;

        reasons.push(
            "<span class='bonus'>CORE複数一致</span>"
        );
    }

    if(coreHit >= 6){

        BONUS *= 1.04;

        reasons.push(
            "<span class='bonus'>期待値条件大量一致</span>"
        );
    }

    // =========================
    // BONUS上限
    // =========================

    if(BONUS > 1.75){

        BONUS = 1.75;
    }

    // =========================
    // 最終スコア
    // =========================

    let fs = Math.round(EV * BONUS);

    const resArea = document.getElementById('res_v17');
    const resMain = document.getElementById('res_main');

    resArea.style.display = 'block';

    document.getElementById('res_score').innerText =
        "V20.0 Score : " + fs + "pt";

    document.getElementById('res_reason').innerHTML =
        reasons.map(r => "・" + r).join("<br>");

    // =========================
    // 判定
    // =========================

    if(
        fs >= 360 &&
        coreHit >= 3 &&
        wRank >= 4 &&
        wRank <= 9
    ){

        resArea.className = "sl-result rank-1";

        resMain.innerHTML =
        "🔥 激アツ期待値馬<br><small>全券種で購入推奨</small>";

        resMain.style.color = "#ff0000";
    }

    else if(fs >= 270){

        resArea.className = "sl-result";

        resMain.innerHTML =
        "◎ 高期待値馬<br><small>1〜2着候補・連軸推奨</small>";

        resMain.style.color = "#ffe066";
    }

    else if(fs >= 200){

        resArea.className = "sl-result";

        resMain.innerHTML =
        "○ 相手候補<br><small>2〜3着候補・3連系向き</small>";

        resMain.style.color = "#7fd1ff";
    }

    else if(
        wRank <= 3 &&
        fs >= 170 &&
        coreHit <= 2
    ){

        resArea.className = "sl-result";

        resMain.innerHTML =
        "▲ 実力ある低期待値馬<br><small>単体購入は非推奨</small>";

        resMain.style.color = "#ff9f43";
    }

    else{

        resArea.className = "sl-result";

        resMain.innerHTML =
        "✕ 見送り<br><small>期待値的に非推奨</small>";

        resMain.style.color = "#999";
    }

    resArea.scrollIntoView({
        behavior:'smooth',
        block:'center'
    });

});

// =========================
// リセット
// =========================

document.getElementById('reset_v17').addEventListener('click', function() {

    const selects = document.querySelectorAll('select');

    selects.forEach(s => s.selectedIndex = 0);

    const inputs =
        document.querySelectorAll('input[type="number"]');

    inputs.forEach(i => i.value = '');

    document.getElementById('res_v17').style.display = 'none';

    window.scrollTo(0,0);

});

</script>
